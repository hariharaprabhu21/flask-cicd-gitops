apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flask-dev
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: flask-app
    count: 1
patches:
  - target:
      kind: Service
      name: flask-app
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
images:
  - name: hariharaprabhu21/flask-cicd
    newTag: main-13